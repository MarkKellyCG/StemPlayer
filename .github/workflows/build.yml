name: Build StemPlayer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No -G/-A: let CMake choose whichever Visual Studio the runner image has (64-bit on a 64-bit host).
      # On failure the tail of the output is published as an annotation (visible without logging in).
      - name: Configure (downloads JUCE 8.0.4)
        shell: pwsh
        run: |
          cmake -S . -B build -DSTEMPLAYER_BUILD_TESTS=OFF 2>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            $gens = (cmake --help | Select-String 'Visual Studio') -join '%0A'
            $tail = (Get-Content cfg.log -Tail 30) -join '%0A'
            Write-Host "::error title=CMake configure failed::$tail%0A--- generators:%0A$gens"
            exit 1
          }

      - name: Build VST3 (Release, x64)
        shell: pwsh
        run: |
          cmake --build build --config Release --target StemPlayer_VST3 --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $errs = (Select-String -Path build.log -Pattern 'error' | Select-Object -First 15 | ForEach-Object { $_.Line }) -join '%0A'
            Write-Host "::error title=Windows build failed::$errs"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse build/StemPlayer_artefacts/Release/VST3/StemPlayer.vst3 dist/
          Copy-Item -Recurse Helper dist/Helper
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: StemPlayer-win64
          path: dist

  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for JUCE
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Python test deps (no PyTorch needed)
        run: |
          python3 -m venv venv
          venv/bin/pip install numpy scipy soundfile

      - name: Helper unit tests
        run: venv/bin/python Tests/test_helper.py

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target StemPlayerTests --parallel

      - name: Plugin tests (includes a real helper run using the fake model)
        env:
          STEMPLAYER_TEST_HELPER: ${{ github.workspace }}/Helper/stemsplit.py
          STEMPLAYER_PYTHON: ${{ github.workspace }}/venv/bin/python
          STEMPLAYER_HELPER_ARGS: "--model fake"
        run: ./build/StemPlayerTests_artefacts/Release/StemPlayerTests
